name: CI Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Run tests
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run tests
      env:
        TRADIER_API_TOKEN: ${{ secrets.TRADIER_API_TOKEN || 'test-token' }}
        MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || 'test-key' }}
        ALLOW_ORIGINS: "*"
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=xml \
          --cov-report=term-missing \
          --junitxml=junit.xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: junit.xml

  # Job 2: Build Docker image (test that it builds). AWS deploy job removed 2026-10-20 — infra torn down.
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: optionskit-backend:test
        load: true  # Load image into local Docker daemon
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          API_VERSION=test
          GIT_SHA=${{ github.sha }}
          GIT_TAG=
    
    - name: Test Docker image health
      run: |
        # Verify image exists
        docker images | grep optionskit-backend || exit 1

        # Start Redis (required dependency)
        docker run -d --name test-redis -p 6379:6379 redis:7-alpine

        # Run container linked to Redis
        docker run -d -p 8000:8000 --name test-container \
          --link test-redis:redis \
          -e TRADIER_API_TOKEN=test \
          -e MASSIVE_API_KEY=test \
          -e REDIS_URL=redis://redis:6379 \
          optionskit-backend:test

        # Wait for app to start
        sleep 15

        # Test health endpoint
        curl -f http://localhost:8000/healthz || exit 1

        # Test version endpoint
        curl -f http://localhost:8000/version || exit 1

        # Cleanup
        docker stop test-container test-redis
        docker rm test-container test-redis
